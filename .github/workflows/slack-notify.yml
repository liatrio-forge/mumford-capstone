name: Slack Notify

on:
  workflow_call:
    inputs:
      workflow_name:
        description: Display name of the workflow that completed
        required: true
        type: string
      workflow_conclusion:
        description: Conclusion of the workflow run (success or failure)
        required: true
        type: string
      run_id:
        description: ID of the workflow run
        required: true
        type: string
      run_url:
        description: URL to the workflow run on GitHub
        required: true
        type: string
      branch:
        description: Branch the workflow ran on
        required: true
        type: string
      commit_sha:
        description: Full SHA of the commit that triggered the workflow
        required: true
        type: string
      commit_message:
        description: Commit message that triggered the workflow
        required: true
        type: string
      actor:
        description: GitHub username of the user who triggered the workflow
        required: true
        type: string
    secrets:
      SLACK_BOT_TOKEN:
        description: Slack bot OAuth token with users:read, users:read.email, im:write, chat:write scopes
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Get GitHub actor email
        id: get_email
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTOR="${{ inputs.actor }}"
          EMAIL=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/$ACTOR" | jq -r '.email')
          echo "actor_email=$EMAIL" >> "$GITHUB_OUTPUT"

      - name: Check email resolved
        id: check_email
        run: |
          EMAIL="${{ steps.get_email.outputs.actor_email }}"
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ]; then
            echo "WARNING: No public email found for actor ${{ inputs.actor }} — skipping DM"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Email resolved: $EMAIL"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lookup Slack user by email
        id: lookup_slack
        if: steps.check_email.outputs.skip != 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          EMAIL="${{ steps.get_email.outputs.actor_email }}"
          RESPONSE=$(curl -fsSL \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://slack.com/api/users.lookupByEmail?email=$EMAIL")
          OK=$(echo "$RESPONSE" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            ERROR=$(echo "$RESPONSE" | jq -r '.error')
            echo "WARNING: Could not resolve Slack user for actor ${{ inputs.actor }} (error: $ERROR) — skipping DM"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            USER_ID=$(echo "$RESPONSE" | jq -r '.user.id')
            echo "Slack user ID resolved"
            echo "slack_user_id=$USER_ID" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open Slack DM channel
        id: open_dm
        if: steps.check_email.outputs.skip != 'true' && steps.lookup_slack.outputs.skip != 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          USER_ID="${{ steps.lookup_slack.outputs.slack_user_id }}"
          RESPONSE=$(curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"users\":\"$USER_ID\"}" \
            "https://slack.com/api/conversations.open")
          OK=$(echo "$RESPONSE" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            ERROR=$(echo "$RESPONSE" | jq -r '.error')
            echo "ERROR: Failed to open DM channel (error: $ERROR)"
            exit 1
          fi
          CHANNEL_ID=$(echo "$RESPONSE" | jq -r '.channel.id')
          echo "DM channel opened"
          echo "dm_channel_id=$CHANNEL_ID" >> "$GITHUB_OUTPUT"

      - name: Send success DM
        id: send_success
        if: inputs.workflow_conclusion == 'success' && steps.open_dm.outputs.dm_channel_id != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          CHANNEL_ID="${{ steps.open_dm.outputs.dm_channel_id }}"
          PAYLOAD=$(cat <<JSON
          {
            "channel": "$CHANNEL_ID",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": ":white_check_mark: Workflow Succeeded",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Workflow*\n${{ inputs.workflow_name }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Branch*\n${{ inputs.branch }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Triggered by*\n${{ inputs.actor }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Commit*\n\`$(echo '${{ inputs.commit_sha }}' | cut -c1-7)\` ${{ inputs.commit_message }}"
                  }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Run",
                      "emoji": true
                    },
                    "url": "${{ inputs.run_url }}",
                    "style": "primary"
                  }
                ]
              }
            ]
          }
          JSON
          )
          RESPONSE=$(curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://slack.com/api/chat.postMessage")
          OK=$(echo "$RESPONSE" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            ERROR=$(echo "$RESPONSE" | jq -r '.error')
            echo "ERROR: Failed to send success DM (error: $ERROR)"
            exit 1
          fi
          echo "Success DM sent"
